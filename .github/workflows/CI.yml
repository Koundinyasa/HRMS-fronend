name: KTS-People360 CI/CD

on:
  push:
    branches:
      - Devops_SUBBU
  pull_request:
    branches:
      - Devops_SUBBU
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  DOCKER_IMAGE_FRONTEND: kts-people360-frontend

jobs:

  # ================================================
  # JOB 1: Frontend Install and Build
  # ================================================

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # ================================================
  # JOB 2: Security Scan - Frontend
  # ================================================

  security-scan-frontend:
    name: Security Scan Frontend
    runs-on: ubuntu-latest

    needs: build-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Frontend Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend
          path: trivy-frontend.sarif


  # ================================================
  # JOB 3: Build and Push Frontend Docker Image
  # ================================================

  build-and-push:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest

    needs:
      - build-frontend
      - security-scan-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------
      # Frontend Image
      # --------------------------------------------

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ================================================
  # JOB 4: Docker Image Security Scan
  # ================================================

  image-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true


  # ================================================
  # JOB 5: Deployment
  # ================================================

  deploy:
    name: Deploy Frontend to AWS
    runs-on: ubuntu-latest

    needs: image-security-scan

    if: github.ref == 'refs/heads/Devops_CICD'

    steps:
      - name: Deployment Information
        run: |
          echo "=========================================="
          echo "KTS-People360 Frontend Deployment"
          echo "=========================================="
          echo "Branch: Devops_CICD"
          echo "Frontend Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest"
          echo "Target: AWS EKS"
          echo "=========================================="